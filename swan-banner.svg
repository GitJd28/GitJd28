<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#1c2128"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </radialGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="moonGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <symbol id="swanShape" viewBox="0 0 220 160">
      <path d="M20,115 C15,95 30,80 55,78 C90,75 95,45 78,25 C68,13 75,2 88,3
               C98,4 100,15 92,20 C100,22 108,20 112,14 C106,10 98,10 92,14
               C85,18 80,25 85,35 C92,50 100,65 95,85 C90,105 70,118 45,120
               C35,121 25,119 20,115 Z" fill="#f0f6fc"/>
      <path d="M50,85 C60,75 75,72 85,80 C75,85 60,88 50,85 Z" fill="#c9d1d9"/>
      <path d="M108,15 C112,13 117,11 120,8 C117,13 112,16 107,18 Z" fill="#e3b341"/>
      <circle cx="90" cy="15" r="2.2" fill="#0d1117"/>
    </symbol>
  </defs>

  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <circle cx="1060" cy="75" r="30" fill="#f0f6fc" filter="url(#moonGlow)" opacity="0.5"/>
  <circle cx="1060" cy="75" r="26" fill="#f0f6fc"/>
  <circle cx="1070" cy="68" r="24" fill="#0d1117"/>

  <g fill="#f0f6fc">
    <circle cx="120" cy="50" r="1.4" opacity="0.7"/>
    <circle cx="220" cy="90" r="1" opacity="0.5"/>
    <circle cx="340" cy="40" r="1.6" opacity="0.6"/>
    <circle cx="460" cy="70" r="1" opacity="0.4"/>
    <circle cx="600" cy="35" r="1.3" opacity="0.6"/>
    <circle cx="720" cy="60" r="1" opacity="0.5"/>
    <circle cx="850" cy="30" r="1.5" opacity="0.5"/>
    <circle cx="950" cy="55" r="1" opacity="0.4"/>
    <circle cx="180" cy="120" r="1" opacity="0.3"/>
    <circle cx="500" cy="100" r="1.2" opacity="0.4"/>
  </g>

  <rect x="0" y="255" width="1200" height="145" fill="url(#waterGrad)"/>
  <line x1="0" y1="256" x2="1200" y2="256" stroke="#30363d" stroke-width="1" opacity="0.6"/>

  <g opacity="0.5">
    <g transform="translate(560,150) scale(0.55)"><use href="#swanShape" width="220" height="160"/></g>
    <g transform="translate(560,255) scale(0.55,-0.4)" opacity="0.35" filter="url(#softBlur)">
      <use href="#swanShape" width="220" height="160"/>
    </g>
  </g>

  <g>
    <g transform="translate(130,160) scale(0.9)"><use href="#swanShape" width="220" height="160"/></g>
    <g transform="translate(130,280) scale(0.9,-0.55)" opacity="0.22" filter="url(#softBlur)">
      <use href="#swanShape" width="220" height="160"/>
    </g>
  </g>

  <g transform="scale(-1,1) translate(-1200,0)">
    <g transform="translate(180,190) scale(0.7)"><use href="#swanShape" width="220" height="160"/></g>
    <g transform="translate(180,300) scale(0.7,-0.45)" opacity="0.2" filter="url(#softBlur)">
      <use href="#swanShape" width="220" height="160"/>
    </g>
  </g>

  <g stroke="#8b949e" fill="none" opacity="0.25">
    <path d="M700,300 Q730,295 760,300 T820,300"/>
    <path d="M850,330 Q880,325 910,330 T970,330"/>
    <path d="M50,340 Q90,335 130,340 T210,340"/>
  </g>

  <text x="600" y="200" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#f0f6fc" letter-spacing="2">Janhavi Deo</text>
  <text x="600" y="232" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="17" fill="#8b949e" letter-spacing="1">Power Platform Intern &#8226; Becoming a Data Analyst</text>
</svg>
